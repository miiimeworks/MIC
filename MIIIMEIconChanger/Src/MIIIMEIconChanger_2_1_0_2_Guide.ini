; MIIIME Icon Changer Configuration
; ⓒ 2026 MIIIME

; 이 파일은 ANSI 인코딩으로 저장되어야 합니다.
; This file must be saved in ANSI encoding.

[ExtractConfig]

NamingRule=2
; 아이콘 저장 시 파일명 규칙 / File naming rule when saving icons
; 1 = 리소스 ID 이름으로 저장 (예: MAINICON.ico, 1.ico ...)
;     Save as resource ID name (e.g., MAINICON.ico, 1.ico ...)
; 2 = 대상 EXE 파일명 기준으로 저장 (예: AppName_001.ico, AppName_002.ico ...)
;     Save based on the target EXE filename (e.g., AppName_001.ico, AppName_002.ico ...)

ExtractMethod=2
; 아이콘 추출 방식 / Icon extraction method
; 1 = 모든 아이콘 추출 / Extract all icons
; 2 = 첫 번째 아이콘만 추출 / Extract only the first icon
; 조합 예시 / Combination Examples:
;   ExtractMethod=1 + NamingRule=1 -> MAINICON.ico, 1.ico ...
;   ExtractMethod=1 + NamingRule=2 -> AppName_001.ico, AppName_002.ico ...
;   ExtractMethod=2              -> 단일 .ico 파일 1개 / A single .ico file

SaveMethod=1
; 저장 경로 결정 방식 / Save path determination method
; 1 = 대상 EXE와 같은 폴더에 자동 저장 / Auto-save in the same folder as the target EXE
; 2 = 저장 경로를 직접 지정 (대화상자 표시) / Manually specify the path (Show dialog)

ExtractionMode=1
; 아이콘 ID 탐색 방식 (추출 성공률 vs 속도 트레이드오프)
; Icon ID search method (Success rate vs. Speed tradeoff)
; 1 = Light (빠름/Fast) : MAINICON / 1 / 101 의 3가지 ID만 시도
;                        Tries only 3 IDs: MAINICON / 1 / 101.
;                        표준적인 EXE는 대부분 이 방식으로 충분합니다.
;                        Sufficient for most standard EXEs.
;                        실패 시 INI에서 2번으로 변경 후 재시도하십시오.
;                        If it fails, change to 2 in the INI and retry.
; 2 = Deep (느림/Slow) : ResourceHacker -action list 로 실제 존재하는 ID를 먼저 조회한 뒤 해당 ID만 정확히 추출합니다.
;                        Queries existing IDs using 'ResourceHacker -action list' first, then extracts them accurately.
;                        조회 실패 시 스마트 브루트포스(DeepModeGap 참조)로 자동 전환합니다.
;                        If the query fails, automatically switches to Smart Brute-force (see DeepModeGap).

[Options]

BackupBeforeChange=1
; 아이콘 교체 전 원본 EXE 백업 파일 생성 여부
; Whether to create a backup of the original EXE before replacing the icon
; 0 = 백업하지 않음 / Do not backup
; 1 = 백업 (.bak 파일 생성) / Create backup (.bak file)

ChangeDescription=1
; 아이콘 교체 후 EXE FileDescription 리소스를 파일명(확장자 제외)으로 변경 여부
; Whether to update the EXE FileDescription resource to match the filename (without extension) after icon replacement
; 0 = 변경하지 않음 / Do not change
; 1 = 파일명과 동일하게 변경 / Change to match the filename

LogLevel=0
; 로그 기록 레벨 / Logging level
; 0 = 로그 비활성화 / Disable logging
; 1 = INFO / WARN / ERROR 기록 / Record INFO / WARN / ERROR
; 2 = DEBUG 포함 전체 기록 / Record all including DEBUG

[Advanced]

LogRotationSize=5242880
; 로그 파일 최대 크기 (Bytes) / Maximum log file size (Bytes)
; 이 크기를 초과하면 .log.old 로 백업 후 새로 기록합니다.
; If exceeded, backs up as .log.old and starts a new log.
; 기본값: 5242880 (5MB) / Default: 5242880 (5MB)

DeepModeGap=20
; Deep 모드 브루트포스 폴백의 연속 실패 허용 횟수
; Allowed consecutive failures for Deep mode brute-force fallback
; 아이콘을 하나 이상 찾은 상태에서 이 값만큼 연속 실패하면 탐색을 조기 종료합니다.
; If it fails consecutively this many times after finding at least one icon, the search ends early.
; 값이 클수록 희귀 ID까지 탐색하지만 시간이 늘어납니다.
; Higher values search for rare IDs but increase processing time.
; 권장 범위: 10 ~ 50 (기본값: 20) / Recommended range: 10 ~ 50 (Default: 20)
